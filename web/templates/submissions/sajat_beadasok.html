{% extends "base.html" %}
{% block tartalom %}
  <h1>Beadásaim</h1>
  {% if beadasok %}
    <table>
      <thead><tr><th>Feladat</th><th>Állapot</th><th>Beadva</th></tr></thead>
      <tbody>
      {% for b in beadasok %}
        <tr>
          <td>{{ b.kiosztas.feladat.kod }}</td>
          <td>{{ b.get_allapot_display }}</td>
          <td>{{ b.letrehozva|date:"Y.m.d. H:i" }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>Még nincs beadásod.</p>
  {% endif %}
{% endblock %}
