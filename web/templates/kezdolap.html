{% extends "base.html" %}
{% block tartalom %}
  <h1>Dimat feladatértékelő</h1>
  {% if user.is_authenticated %}
    <p>Szia, {{ user.first_name|default:user.email }}!</p>
    <p><a href="{% url 'submissions:sajat_beadasok' %}" role="button">Beadásaim</a></p>
  {% else %}
    <p>A használathoz <a href="{% url 'login' %}">lépj be</a>.</p>
  {% endif %}
{% endblock %}
